{% extends "base.html" %}
{# Bố cục chung trang quản trị. Trang con: {% extends "admin/_layout.html" %}{% set active = 'products' %} #}
{% block content %}
<div class="admin-shell">
  <nav class="admin-nav" aria-label="Quản trị">
    <span class="label">Quản trị cửa hàng</span>
    <a class="{{ 'on' if active == 'dashboard' }}" href="{{ url_for('admin.dashboard') }}">Tổng quan</a>
    <a class="{{ 'on' if active == 'products' }}" href="{{ url_for('admin.products') }}">Sản phẩm</a>
    <a class="{{ 'on' if active == 'orders' }}" href="{{ url_for('admin.orders') }}">Đơn hàng</a>
    <span class="label">Hệ thống</span>
    <a href="{{ url_for('system.system') }}">Máy chủ</a>
    <a href="{{ url_for('system.live') }}">Cân bằng tải</a>
    <a href="{{ url_for('shop.index') }}">← Về cửa hàng</a>
  </nav>
  <div>{% block admin %}{% endblock %}</div>
</div>
{% endblock %}
